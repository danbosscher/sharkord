[package]
name = "sharkord-linux-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11.2", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_8", "gtk_v4_20"] }
anyhow = "1.0.100"
futures-util = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
