name: Docker Build And Publish
description: Set up Docker build tooling, authenticate, and build/push multi-arch images.

inputs:
  registry:
    description: Container registry hostname
    required: false
    default: ghcr.io
  username:
    description: Registry username
    required: true
  password:
    description: Registry password or token
    required: true
  tags:
    description: Docker image tags (newline separated)
    required: true
  labels:
    description: Docker image labels (newline separated)
    required: false
    default: ""
  context:
    description: Docker build context path
    required: false
    default: "."
  file:
    description: Dockerfile path
    required: false
    default: Dockerfile
  platforms:
    description: Target platforms
    required: false
    default: linux/amd64,linux/arm64
  qemu_platforms:
    description: Platforms to register with QEMU
    required: false
    default: arm64

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ inputs.qemu_platforms }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
