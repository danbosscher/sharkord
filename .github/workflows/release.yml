name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: "none"

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-publish:
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build project artifacts
        uses: ./.github/actions/build-sharkord
        with:
          bump: ${{ inputs.bump }}

      - name: Get new version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Identify user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve image names
        id: image_names
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: ${{ inputs.bump != 'none' }}
        run: |
          git add \
            package.json \
            apps/client/package.json \
            apps/server/package.json \
            packages/e2e/package.json \
            packages/plugin-sdk/package.json \
            packages/scripts/package.json \
            packages/shared/package.json \
            packages/ui/package.json
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }}"

      - name: Check whether release tag already exists
        id: tag_state
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.get_version.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag
        if: ${{ steps.tag_state.outputs.exists != 'true' }}
        run: git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"

      - name: Push commit and tag
        shell: bash
        run: |
          git push origin HEAD
          if [[ "${{ steps.tag_state.outputs.exists }}" != "true" ]]; then
            git push origin "v${{ steps.get_version.outputs.version }}"
          fi

      - name: Build and publish server image
        uses: ./.github/actions/docker-build-publish
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ steps.image_names.outputs.owner_lc }}/${{ steps.image_names.outputs.repo_name }}:latest
            ghcr.io/${{ steps.image_names.outputs.owner_lc }}/${{ steps.image_names.outputs.repo_name }}:v${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Sharkord
            org.opencontainers.image.description=Sharkord Server
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          draft: false
          generate_release_notes: true
          body: |
            ## Container Images
            ```bash
            docker pull ghcr.io/${{ steps.image_names.outputs.owner_lc }}/${{ steps.image_names.outputs.repo_name }}:v${{ steps.get_version.outputs.version }}
            ```
